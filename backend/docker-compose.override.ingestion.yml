version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: pmis_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  ingestion-worker:
    build:
      context: .
      dockerfile: docker/ingestion-worker.Dockerfile
    container_name: pmis_ingestion_worker
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite+aiosqlite:///./pm_internships.db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  ingestion-scheduler:
    build:
      context: .
      dockerfile: docker/ingestion-scheduler.Dockerfile
    container_name: pmis_ingestion_scheduler
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite+aiosqlite:///./pm_internships.db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
